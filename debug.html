<!DOCTYPE html>
<html>
<head>
    <title>Debug Navigation</title>
    <style>
        .section {
            display: none;
            padding: 20px;
            margin: 10px;
            background-color: #f0f0f0;
        }
        .section.active {
            display: block;
        }
        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
        button.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Navigation Debug</h1>
    
    <div class="nav-panel">
        <button id="section1Btn" class="active">Section 1</button>
        <button id="section2Btn">Section 2</button>
        <button id="section3Btn">Section 3</button>
    </div>
    
    <div id="section1" class="section active">
        <h2>Section 1 Content</h2>
        <p>This is the content of section 1.</p>
    </div>
    
    <div id="section2" class="section">
        <h2>Section 2 Content</h2>
        <p>This is the content of section 2.</p>
    </div>
    
    <div id="section3" class="section">
        <h2>Section 3 Content</h2>
        <p>This is the content of section 3.</p>
    </div>
    
    <script>
        function showSection(sectionId, button) {
            console.log("showSection called with:", sectionId, button);
            
            // Hide all sections
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                section.classList.remove('active');
            });
            
            // Show the selected section
            const selectedSection = document.getElementById(sectionId);
            if (selectedSection) {
                selectedSection.classList.add('active');
                console.log("Section activated:", sectionId);
            } else {
                console.error("Section not found:", sectionId);
            }
            
            // Update active button
            const buttons = document.querySelectorAll('.nav-panel button');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (button) {
                button.classList.add('active');
                console.log("Button activated:", button.id);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Add click listeners to buttons
            document.querySelectorAll('.nav-panel button').forEach(button => {
                button.addEventListener('click', function() {
                    const sectionId = this.id.replace('Btn', '');
                    showSection(sectionId, this);
                });
            });
            
            // Initialize to first section
            showSection('section1', document.getElementById('section1Btn'));
        });
    </script>
</body>
</html>
